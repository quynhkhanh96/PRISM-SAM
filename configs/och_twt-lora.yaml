# PRISM-SAM main recipe (= pre-revision OCH-scopefull-projqkvo-r8-alpha8-...-ep100-shots100-fixedsched)
data: och
backbone: sam1
model_type: vit_l
variant: twt-lora            # see prismsam/variants.py
train:
  lr: 1.0e-4
  total_steps: 5000          # N=100, batch 2 -> 50 steps/epoch -> 100 epochs
benchmark:
  tau: 0.35
  N: 100
  # few-shot file default: {results_root}/benchmarks/och/train/tau035/s{seed}/fewshot_N100.json
  # (populated by scripts/batch0_och.py from the pre-revision fewshot_data/)